name: ddia-hw1

x-app: &app
  build: ./app
  image: ddia-hw1/orders-service:local
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 12

x-app-env: &app-env
  DEPLOYMENT_NAME: orders-service
  FAULT_RATE: "0.05"

services:
  app-dc1-pod0:
    <<: *app
    environment:
      <<: *app-env
      DATACENTER: dc1
      POD_ID: "0"
    ports: ["8081:8000"]

  app-dc1-pod1:
    <<: *app
    environment:
      <<: *app-env
      DATACENTER: dc1
      POD_ID: "1"
    ports: ["8082:8000"]

  app-dc2-pod0:
    <<: *app
    environment:
      <<: *app-env
      DATACENTER: dc2
      POD_ID: "0"
    ports: ["8083:8000"]

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.1
    restart: unless-stopped
    command:
      - -promscrape.config=/etc/vm/scrape.yml
      - -retentionPeriod=7d
      - -storageDataPath=/storage
    volumes:
      - ./victoriametrics/scrape.yml:/etc/vm/scrape.yml:ro
      - vm-data:/storage
    ports: ["8428:8428"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    image: grafana/grafana:11.6.16
    restart: unless-stopped
    depends_on:
      victoriametrics:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24

  grafana-init:
    image: python:3.13-alpine
    depends_on:
      grafana:
        condition: service_healthy
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: admin
      GRAFANA_ADMIN_PASSWORD_FILE: /run/secrets/grafana_admin_password
      SA_NAME: dashboard-generator
      SA_ROLE: Editor
      TOKEN_FILE: /run/grafana-sa/token
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana-init/create_sa_token.py:/srv/create_sa_token.py:ro
      - grafana-sa-token:/run/grafana-sa
    command: ["python", "/srv/create_sa_token.py"]

  dashboard-generator:
    build: ./generator
    depends_on:
      app-dc1-pod0:
        condition: service_healthy
      app-dc1-pod1:
        condition: service_healthy
      app-dc2-pod0:
        condition: service_healthy
      grafana-init:
        condition: service_completed_successfully
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_TOKEN_FILE: /run/grafana-sa/token
      TARGET_URL: http://app-dc1-pod0:8000
      DATASOURCE_UID: victoriametrics
    volumes:
      - grafana-sa-token:/run/grafana-sa:ro

  loadgen:
    image: grafana/k6:2.3.0
    command: ["run", "/scripts/load.js"]
    volumes:
      - ./loadgen:/scripts:ro
    depends_on:
      dashboard-generator:
        condition: service_completed_successfully
    environment:
      TARGET_URLS: http://app-dc1-pod0:8000,http://app-dc1-pod1:8000,http://app-dc2-pod0:8000

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt

volumes:
  vm-data:
  grafana-data:
  grafana-sa-token:
